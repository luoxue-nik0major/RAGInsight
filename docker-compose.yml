services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Secrets and tunables come from .env.docker (RAGINSIGHT_DEEPSEEK_API_KEY,
    # RAGINSIGHT_DEEPSEEK_MODEL, ...). Do NOT re-declare them via ${...:-}
    # interpolation here — empty defaults would override the env_file values.
    env_file:
      - .env.docker
    environment:
      # Container-internal fixed values only.
      - RAGINSIGHT_DATABASE_URL=sqlite+aiosqlite:///./db/raginsight.db
      - RAGINSIGHT_CHROMA_DB_PATH=./chroma_db
    volumes:
      - backend_data:/app/chroma_db
      - backend_sqlite:/app/db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_sqlite:
